<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up — QuietSpace</title><link rel="stylesheet" href="../src/css/style.css"><script defer src="../src/js/main.js"></script></head><body class="auth-page"><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">q</span> QuietSpace</a><a class="text-link" href="login.html">Already a member?</a></header><main class="auth-card"><a class="back-link" href="../index.html">← Back home</a><span class="eyebrow">Make yourself at home</span><h1>Start with a little space.</h1><p class="muted">Choose a name and make your profile yours.</p><form data-auth="signup"><label for="signup-name">Username</label><input id="signup-name" name="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" required placeholder="letters, numbers, underscores"><label for="signup-display">Display name</label><input id="signup-display" name="displayName" maxlength="40" required placeholder="How people will see you"><label for="signup-pass">Password</label><input id="signup-pass" name="password" type="password" minlength="6" required placeholder="At least 6 characters"><label class="check-row"><input type="checkbox" name="agree" required> I understand this is a frontend prototype.</label><button class="button primary full" type="submit">Create my account</button><p class="form-message" aria-live="polite"></p></form><p class="fine-print">Use fictional details only. This prototype does not provide production-grade authentication.</p></main></body></html>
