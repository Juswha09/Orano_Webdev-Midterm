<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — QuietSpace</title><link rel="stylesheet" href="../src/css/style.css"><script defer src="../src/js/main.js"></script></head><body class="auth-page"><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">q</span> QuietSpace</a><a class="text-link" href="signup.html">Create account</a></header><main class="auth-card"><a class="back-link" href="../index.html">← Back home</a><span class="eyebrow">Welcome back</span><h1>Pick up where you left off.</h1><p class="muted">This demo signs you in locally on this device.</p><form data-auth="login"><label for="login-name">Username</label><input id="login-name" name="username" autocomplete="username" required placeholder="e.g. river"><label for="login-pass">Password</label><input id="login-pass" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button class="button primary full" type="submit">Log in</button><p class="form-message" aria-live="polite"></p></form><p class="auth-switch">New to QuietSpace? <a href="signup.html">Join the community</a></p><p class="fine-print">Demo credentials are stored in localStorage and are not suitable for real accounts.</p></main></body></html>
